spring:
  application:
    name: aimatrix

  # Redis（短期记忆：会话状态存储）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aimatrix}?currentSchema=public
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
  ai:
    model:
      embedding: ${AI_MODEL_EMBEDDING:dashscope}
    vectorstore:
      pgvector:
        index-type: ${PGVECTOR_INDEX_TYPE:HNSW}
        distance-type: ${PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
        dimensions: ${PGVECTOR_DIMENSIONS:1024}
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}
        schema-validation: ${PGVECTOR_SCHEMA_VALIDATION:true}  
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      base-url: ${AI_DASHSCOPE_BASE_URL}
      chat:
        options:
          model: ${AI_DASHSCOPE_CHAT_MODEL}
      embedding:
        options:
          model: ${AI_DASHSCOPE_EMBEDDING_MODEL}
          dimensions: ${AI_DASHSCOPE_EMBEDDING_DIMENSIONS}
#    openai:
#      api-key: ${OPENAI_API_KEY}
#      base-url: ${OPENAI_BASE_URL}
#      chat:
#        options:
#          model: ${OPENAI_CHAT_MODEL}
#          temperature: ${OPENAI_TEMPERATURE}

server:
  port: ${SERVER_PORT:8080}

# Agent配置
agent:
  name: ${AGENT_NAME:aimatrix-agent}
  max-iterations: ${AGENT_MAX_ITERATIONS:10}
  # 记忆与上下文策略配置
  memory:
    # 短期记忆：单个会话保留的最大消息条数（超出后按对话轮次边界裁剪）
    window-size: ${AGENT_MEMORY_WINDOW_SIZE:20}
    # 长期记忆：每次检索召回的记忆条数
    recall-top-k: ${AGENT_MEMORY_RECALL_TOP_K:5}
    # 长期记忆：检索相似度下限，低于该值的记忆不再注入（过滤低相关噪声，<=0 表示不限制）
    similarity-threshold: ${AGENT_MEMORY_SIMILARITY_THRESHOLD:0.5}
  # 可观测配置（进程内轻量观测：自研埋点走单行日志，框架指标走 Actuator 端点）
  observability:
    # 总开关：关闭后不采集、不打印，行为与未接入观测时完全一致
    enabled: ${AGENT_OBS_ENABLED:true}
    # 单次模型调用耗时超过该阈值时，日志中标记 slow=true（毫秒）
    slow-call-threshold-ms: ${AGENT_OBS_SLOW_CALL_THRESHOLD_MS:5000}
    # 是否在日志中输出提示词/回复原文（默认关闭，避免敏感信息外泄与日志膨胀）
    log-payload: ${AGENT_OBS_LOG_PAYLOAD:false}

# 日志配置
logging:
  level:
    root: WARN
    com.vectrans.aimatrix: INFO
    # 开发调试
    # com.alibaba.cloud.ai.graph: DEBUG
    # com.alibaba.cloud.ai.dashscope: DEBUG
    # org.springframework.ai.chat: DEBUG

# Actuator 端点（被动拉取框架自带指标：token 用量、模型耗时、向量库、工具调用）
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
